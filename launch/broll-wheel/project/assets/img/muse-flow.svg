<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">How Muse works, from its site</title>
  <desc id="desc">Five stages: you tell Muse a goal, it builds an action plan, it works in its Secure VM with a browser, you approve critical actions, and a complete audit trail records what it did.</desc>
  <rect width="1600" height="620" rx="44" fill="#e8eef6"/>
  <path d="M190 300 C330 250 420 350 560 300 S820 250 960 302 S1220 352 1430 296" fill="none" stroke="#4ba9fe" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 22"/>
  <g font-family="DM Sans, Arial, sans-serif" fill="#0a1317">
    <g transform="translate(54 124)">
      <rect x="20" y="40" width="250" height="150" rx="40" fill="#ffffff" stroke="#0a1317" stroke-width="7"/>
      <path d="M70 190 l-10 50 50-50z" fill="#ffffff" stroke="#0a1317" stroke-width="7" stroke-linejoin="round"/>
      <path d="M70 100h150M70 140h100" stroke="#4ba9fe" stroke-width="12" stroke-linecap="round"/>
      <text x="20" y="424" font-size="34" font-weight="700">You ask</text>
      <text x="20" y="464" font-size="22" fill="#5d6c7b">just tell Muse the goal</text>
    </g>
    <g transform="translate(388 124)">
      <rect x="0" y="20" width="265" height="340" rx="22" fill="#ffffff" stroke="#0a1317" stroke-width="7"/>
      <g stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M42 90l18 18 32-34M42 175l18 18 32-34" stroke="#0457cb"/>
        <rect x="42" y="240" width="48" height="48" rx="10" stroke="#5d6c7b" stroke-width="7"/>
        <path d="M120 98h105M120 183h105M120 266h80" stroke="#0a1317"/>
      </g>
      <text x="0" y="424" font-size="34" font-weight="700">It plans</text>
      <text x="0" y="464" font-size="22" fill="#5d6c7b">an action plan, tracked</text>
    </g>
    <g transform="translate(724 124)">
      <rect x="0" y="40" width="290" height="300" rx="22" fill="#0457cb"/>
      <rect x="0" y="40" width="290" height="56" rx="22" fill="#0a1317"/>
      <circle cx="34" cy="68" r="9" fill="#ff5f57"/><circle cx="62" cy="68" r="9" fill="#febc2e"/><circle cx="90" cy="68" r="9" fill="#28c840"/>
      <rect x="30" y="126" width="230" height="40" rx="20" fill="#ffffff"/>
      <path d="M40 210h210M40 252h170M40 294h190" stroke="#a9d4ff" stroke-width="12" stroke-linecap="round"/>
      <text x="0" y="424" font-size="34" font-weight="700">Secure VM</text>
      <text x="0" y="464" font-size="22" fill="#5d6c7b">its own computer and browser</text>
    </g>
    <g transform="translate(1066 124)">
      <rect x="0" y="40" width="280" height="300" rx="22" fill="#ffffff" stroke="#0a1317" stroke-width="7"/>
      <path d="M40 110h200M40 150h150" stroke="#5d6c7b" stroke-width="12" stroke-linecap="round"/>
      <rect x="40" y="220" width="120" height="64" rx="32" fill="#0457cb"/>
      <text x="100" y="262" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Allow</text>
      <rect x="176" y="220" width="70" height="64" rx="32" fill="#e8eef6"/>
      <text x="0" y="424" font-size="34" font-weight="700">You approve</text>
      <text x="0" y="464" font-size="22" fill="#5d6c7b">emails, purchases wait</text>
    </g>
    <g transform="translate(1391 124)">
      <rect x="0" y="20" width="170" height="340" rx="22" fill="#ffffff" stroke="#0a1317" stroke-width="7"/>
      <g fill="#0457cb"><circle cx="40" cy="80" r="11"/><circle cx="40" cy="150" r="11"/><circle cx="40" cy="220" r="11"/><circle cx="40" cy="290" r="11" fill="#a9d4ff"/></g>
      <path d="M40 80v210" stroke="#0457cb" stroke-width="5"/>
      <path d="M70 80h70M70 150h55M70 220h70M70 290h45" stroke="#0a1317" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="424" font-size="34" font-weight="700">Audit trail</text>
      <text x="0" y="464" font-size="22" fill="#5d6c7b">everything it did</text>
    </g>
  </g>
</svg>
